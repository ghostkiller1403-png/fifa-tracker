<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA Knockout Tracker</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --pitch-black:#081813;
    --pitch:#0B241B;
    --card:#102B21;
    --card-2:#143528;
    --line:#1E4735;
    --grass:#2FA36B;
    --grass-dim:#1F7A4D;
    --cream:#F1E9D5;
    --muted:#8AA398;
    --yellow:#E7C75A;
    --red:#D95C5C;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    background:
      radial-gradient(circle at top left,rgba(47,163,107,.08),transparent 30%),
      var(--pitch-black);
    color:var(--cream);
    font-family:Inter,Arial,sans-serif;
    min-height:100vh;
  }

  .wrap{
    width:min(1500px,96vw);
    margin:auto;
    padding:28px 0 60px;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    border-bottom:1px solid var(--line);
    padding-bottom:22px;
    margin-bottom:24px;
  }

  .eyebrow{
    font:11px 'Space Mono',monospace;
    letter-spacing:2px;
    color:var(--grass);
    text-transform:uppercase;
    margin-bottom:8px;
  }

  h1{
    margin:0;
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(30px,5vw,58px);
    line-height:.95;
    letter-spacing:-2px;
  }

  .subtitle{
    color:var(--muted);
    font:12px 'Space Mono',monospace;
    margin-top:10px;
  }

  .status{
    text-align:right;
    font:11px 'Space Mono',monospace;
    color:var(--muted);
  }

  .status strong{
    display:block;
    color:var(--grass);
    font-size:16px;
    margin-top:4px;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
  }

  button,
  select,
  input{
    font:12px 'Space Mono',monospace;
  }

  button{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--cream);
    padding:9px 12px;
    border-radius:5px;
    cursor:pointer;
  }

  button:hover{
    background:var(--card-2);
    border-color:var(--grass-dim);
  }

  input,
  select{
    background:#07130F;
    color:var(--cream);
    border:1px solid var(--line);
    border-radius:4px;
    padding:7px 8px;
  }

  .section-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin:30px 0 12px;
  }

  .section-title h2{
    font:16px 'Archivo Black',sans-serif;
    margin:0;
  }

  .section-title span{
    font:10px 'Space Mono',monospace;
    color:var(--muted);
  }

  .bracket{
    overflow-x:auto;
    padding-bottom:15px;
  }

  .rounds{
    display:grid;
    grid-template-columns:
      repeat(6,minmax(210px,1fr));
    gap:12px;
    min-width:1280px;
  }

  .round{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .round-head{
    font:11px 'Space Mono',monospace;
    color:var(--grass);
    text-transform:uppercase;
    letter-spacing:1px;
    padding:8px 10px;
    border-bottom:1px solid var(--line);
  }

  .match{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.16);
  }

  .match-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 9px;
    background:rgba(0,0,0,.13);
    border-bottom:1px solid var(--line);
  }

  .match-label{
    font:9px 'Space Mono',monospace;
    color:var(--muted);
    text-transform:uppercase;
  }

  .match-status{
    font:9px 'Space Mono',monospace;
    color:var(--yellow);
  }

  .team{
    display:grid;
    grid-template-columns:1fr 34px;
    align-items:center;
    gap:8px;
    padding:9px;
    border-bottom:1px solid rgba(30,71,53,.5);
  }

  .team:last-child{
    border-bottom:0;
  }

  .team-name{
    font-size:12px;
    font-weight:600;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .team-name.winner{
    color:var(--grass);
  }

  .score{
    text-align:center;
    font:700 15px 'Space Mono',monospace;
  }

  .score-box{
    width:34px;
    text-align:center;
    padding:6px 2px;
  }

  .pen-note{
    padding:7px 9px;
    color:var(--yellow);
    font:9px 'Space Mono',monospace;
    border-top:1px solid var(--line);
  }

  .games{
    padding:8px 9px;
    border-top:1px solid var(--line);
  }

  .game{
    font:9px 'Space Mono',monospace;
    color:var(--muted);
    padding:3px 0;
  }

  .champion{
    margin-top:26px;
    border:1px solid var(--grass);
    background:linear-gradient(135deg,rgba(47,163,107,.13),rgba(47,163,107,.02));
    border-radius:7px;
    padding:22px;
    text-align:center;
  }

  .champion .label{
    font:10px 'Space Mono',monospace;
    color:var(--grass);
    letter-spacing:2px;
  }

  .champion .name{
    margin-top:8px;
    font:30px 'Archivo Black',sans-serif;
  }

  .roster-panel{
    margin-top:30px;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:7px;
    padding:18px;
  }

  .roster-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:7px;
  }

  .roster-player{
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    font:11px 'Space Mono',monospace;
    color:var(--muted);
  }

  .empty{
    padding:20px;
    border:1px dashed var(--line);
    color:var(--muted);
    font:11px 'Space Mono',monospace;
    text-align:center;
  }

  .readonly-banner{
    position:fixed;
    bottom:12px;
    right:12px;
    z-index:9999;
    background:#102B21;
    border:1px solid #1E4735;
    color:#8AA398;
    padding:8px 12px;
    border-radius:6px;
    font:11px 'Space Mono',monospace;
    box-shadow:0 4px 18px rgba(0,0,0,.25);
  }

  /*
   * PUBLIC PAGE = READ ONLY
   */

  body.public-viewer input,
  body.public-viewer select,
  body.public-viewer button{
    pointer-events:none;
    opacity:.65;
  }

  body.public-viewer .toolbar,
  body.public-viewer .roster-panel,
  body.public-viewer .match-actions{
    display:none;
  }

  body.public-viewer .score-box{
    pointer-events:none;
    border-color:var(--line);
  }

  @media(max-width:640px){

    .wrap{
      width:94vw;
      padding-top:18px;
    }

    header{
      align-items:flex-start;
      flex-direction:column;
    }

    .status{
      text-align:left;
    }

    h1{
      font-size:38px;
    }

    .readonly-banner{
      font-size:9px;
      bottom:8px;
      right:8px;
    }
  }
</style>
</head>

<body class="public-viewer">

<!--
  IMPORTANT:
  tournament-data.js MUST be in the same folder as this index.html.
-->
<script src="tournament-data.js"></script>

<div class="wrap">

  <header>

    <div>
      <div class="eyebrow">
        FIFA · KNOCKOUT
      </div>

      <h1>
        TOURNAMENT<br>
        TRACKER
      </h1>

      <div class="subtitle">
        PUBLIC TOURNAMENT VIEW
      </div>
    </div>

    <div class="status">
      STATUS
      <strong>LIVE</strong>
      PUBLIC VIEW · READ ONLY
    </div>

  </header>


  <div class="toolbar">
    <button id="refreshBtn">
      REFRESH
    </button>
  </div>


  <div id="app"></div>

</div>


<div class="readonly-banner">
  PUBLIC VIEW · READ ONLY
</div>


<script>

/*
 * ============================================================
 * FIFA KNOCKOUT TRACKER
 *
 * Tournament data comes ONLY from:
 *
 *      tournament-data.js
 *
 * There is deliberately NO localStorage here.
 *
 * To update the tournament:
 *
 *      GitHub
 *          ↓
 *      edit tournament-data.js
 *          ↓
 *      commit
 *          ↓
 *      GitHub Pages deploy
 *          ↓
 *      public page updates
 *
 * ============================================================
 */


let state = {

  players: Array.isArray(TOURNAMENT_DATA.players)
    ? [...TOURNAMENT_DATA.players]
    : [],

  bracket: TOURNAMENT_DATA.bracket
    ? structuredClone(TOURNAMENT_DATA.bracket)
    : null

};


/*
 * ------------------------------------------------------------
 * CONSTANTS
 * ------------------------------------------------------------
 */

const ROUND_ORDER = [
  "prelim",
  "r16",
  "qf",
  "sf",
  "final"
];


/*
 * ------------------------------------------------------------
 * HELPERS
 * ------------------------------------------------------------
 */

function el(tag, attrs, children){

  const node = document.createElement(tag);

  if(attrs){

    Object.entries(attrs).forEach(([key,value]) => {

      if(key === "class"){
        node.className = value;
      }
      else if(key === "text"){
        node.textContent = value;
      }
      else{
        node.setAttribute(key,value);
      }

    });

  }

  if(children){

    children.forEach(child => {

      if(child !== null && child !== undefined){
        node.appendChild(
          typeof child === "string"
            ? document.createTextNode(child)
            : child
        );
      }

    });

  }

  return node;
}


function txt(value){
  return document.createTextNode(
    value === null || value === undefined
      ? ""
      : String(value)
  );
}


/*
 * ------------------------------------------------------------
 * MATCH HELPERS
 * ------------------------------------------------------------
 */

function getWinner(match){

  if(!match){
    return null;
  }

  if(match.winner){
    return match.winner;
  }

  if(match.penWinner){
    return match.penWinner;
  }

  return null;
}


function getLoser(match){

  if(!match){
    return null;
  }

  const winner = getWinner(match);

  if(!winner){
    return null;
  }

  const p1 = match.p1eff || match.p1;
  const p2 = match.p2eff || match.p2;

  if(winner === p1){
    return p2;
  }

  if(winner === p2){
    return p1;
  }

  return null;
}


function resolveRef(bracket, ref){

  if(!ref){
    return null;
  }

  const round = bracket[ref.round];

  if(!round){
    return null;
  }

  const match = round[ref.idx];

  if(!match){
    return null;
  }

  if(ref.loser){
    return getLoser(match);
  }

  return getWinner(match);
}


function resolvePlayer(bracket, match, key, refKey){

  if(match[key]){
    return match[key];
  }

  if(match[refKey]){
    return resolveRef(bracket,match[refKey]);
  }

  return null;
}


function annotate(bracket){

  if(!bracket){
    return bracket;
  }

  const rounds = [
    "prelim",
    "r16",
    "qf",
    "sf",
    "final",
    "third"
  ];

  rounds.forEach(roundName => {

    if(!bracket[roundName]){
      return;
    }

    bracket[roundName].forEach(match => {

      match.p1eff = resolvePlayer(
        bracket,
        match,
        "p1",
        "ref1"
      );

      match.p2eff = resolvePlayer(
        bracket,
        match,
        "p2",
        "ref2"
      );

    });

  });

  return bracket;
}


/*
 * ------------------------------------------------------------
 * ROUND NAMES
 * ------------------------------------------------------------
 */

function roundTitle(round){

  const titles = {

    prelim:"PRELIMINARY",
    r16:"ROUND OF 16",
    qf:"QUARTER FINALS",
    sf:"SEMI FINALS",
    final:"FINAL",
    third:"THIRD PLACE"

  };

  return titles[round] || round.toUpperCase();
}


/*
 * ------------------------------------------------------------
 * MATCH STATUS
 * ------------------------------------------------------------
 */

function matchStatus(match){

  if(!match){
    return "";
  }

  if(match.winner){

    if(match.penalties){
      return "PENALTIES";
    }

    return "FINAL";
  }

  if(match.bo3){

    if(Array.isArray(match.games) && match.games.length){

      return "BEST OF 3";
    }

    return "BEST OF 3";
  }

  if(
    match.score1 !== null &&
    match.score1 !== undefined &&
    match.score2 !== null &&
    match.score2 !== undefined
  ){

    if(
      Number(match.score1) === Number(match.score2) &&
      match.penalties
    ){
      return "PENALTIES";
    }

    return "SCORE";
  }

  return "UPCOMING";
}


/*
 * ------------------------------------------------------------
 * RENDER TEAM
 * ------------------------------------------------------------
 */

function renderTeam(match, player, score, isWinner){

  const row = el("div",{
    class:"team"
  });

  const name = el("div",{
    class:"team-name" +
      (isWinner ? " winner" : "")
  });

  name.textContent = player || "TBD";

  const scoreNode = el("div",{
    class:"score"
  });

  if(
    score !== null &&
    score !== undefined
  ){

    scoreNode.textContent = score;

  }
  else{

    scoreNode.textContent = "–";

  }

  row.appendChild(name);
  row.appendChild(scoreNode);

  return row;
}


/*
 * ------------------------------------------------------------
 * RENDER GAMES
 * ------------------------------------------------------------
 */

function renderGames(match){

  if(
    !match.bo3 ||
    !Array.isArray(match.games) ||
    !match.games.length
  ){

    return null;
  }

  const container = el("div",{
    class:"games"
  });

  const p1Name = match.p1eff || match.p1 || "TBD";
  const p2Name = match.p2eff || match.p2 || "TBD";

  match.games.forEach((game,index) => {

    let text =
      "Game " +
      (index + 1) +
      ": " +
      game.score1 +
      "-" +
      game.score2;

    if(game.pen){

      text += " (pens";

      if(
        game.penaltyScore1 !== undefined &&
        game.penaltyScore2 !== undefined
      ){

        text +=
          " " +
          game.penaltyScore1 +
          "–" +
          game.penaltyScore2;

      }

      text += ")";

    }

    if(game.winnerSide){

      text +=
        " → " +
        (
          game.winnerSide === "p1"
            ? p1Name
            : p2Name
        );

    }

    const gameNode = el("div",{
      class:"game"
    });

    gameNode.textContent = text;

    container.appendChild(gameNode);

  });

  return container;
}


/*
 * ------------------------------------------------------------
 * RENDER MATCH
 * ------------------------------------------------------------
 */

function renderMatch(match,index,round){

  if(!match){
    return el("div",{
      class:"empty",
      text:"NO MATCH"
    });
  }

  const card = el("div",{
    class:"match"
  });


  /*
   * HEADER
   */

  const header = el("div",{
    class:"match-head"
  });

  const label = el("div",{
    class:"match-label"
  });

  label.textContent =
    roundTitle(round) +
    " · MATCH " +
    (index + 1);

  const status = el("div",{
    class:"match-status"
  });

  status.textContent =
    matchStatus(match);

  header.appendChild(label);
  header.appendChild(status);

  card.appendChild(header);


  /*
   * PLAYERS
   */

  const p1 = match.p1eff || match.p1;
  const p2 = match.p2eff || match.p2;

  const winner = getWinner(match);

  card.appendChild(
    renderTeam(
      match,
      p1,
      match.score1,
      winner === p1
    )
  );

  card.appendChild(
    renderTeam(
      match,
      p2,
      match.score2,
      winner === p2
    )
  );


  /*
   * PENALTY INFORMATION
   */

  if(match.penalties && winner){

    let penaltyText =
      "Won on penalties";

    if(
      match.penaltyScore1 !== null &&
      match.penaltyScore1 !== undefined &&
      match.penaltyScore2 !== null &&
      match.penaltyScore2 !== undefined
    ){

      penaltyText +=
        " · Shootout " +
        match.penaltyScore1 +
        "–" +
        match.penaltyScore2;

    }

    const penNote = el("div",{
      class:"pen-note"
    });

    penNote.textContent = penaltyText;

    card.appendChild(penNote);

  }


  /*
   * BEST OF 3 GAMES
   */

  const games = renderGames(match);

  if(games){
    card.appendChild(games);
  }


  return card;
}


/*
 * ------------------------------------------------------------
 * RENDER ROUND
 * ------------------------------------------------------------
 */

function renderRound(roundName){

  const column = el("div",{
    class:"round"
  });

  const title = el("div",{
    class:"round-head"
  });

  title.textContent =
    roundTitle(roundName);

  column.appendChild(title);


  const matches =
    state.bracket &&
    state.bracket[roundName]
      ? state.bracket[roundName]
      : [];


  if(!matches.length){

    column.appendChild(
      el("div",{
        class:"empty",
        text:"NO MATCHES"
      })
    );

    return column;
  }


  matches.forEach((match,index) => {

    column.appendChild(
      renderMatch(
        match,
        index,
        roundName
      )
    );

  });


  return column;
}


/*
 * ------------------------------------------------------------
 * RENDER CHAMPION
 * ------------------------------------------------------------
 */

function renderChampion(){

  if(
    !state.bracket ||
    !state.bracket.final ||
    !state.bracket.final.length
  ){

    return null;
  }

  const finalMatch =
    state.bracket.final[0];

  const winner =
    getWinner(finalMatch);

  if(!winner){
    return null;
  }

  const box = el("div",{
    class:"champion"
  });

  const label = el("div",{
    class:"label"
  });

  label.textContent =
    "🏆 TOURNAMENT CHAMPION";

  const name = el("div",{
    class:"name"
  });

  name.textContent = winner;

  box.appendChild(label);
  box.appendChild(name);

  return box;
}


/*
 * ------------------------------------------------------------
 * RENDER
 * ------------------------------------------------------------
 */

function render(){

  const app =
    document.getElementById("app");

  app.innerHTML = "";


  if(!state.bracket){

    app.appendChild(
      el("div",{
        class:"empty",
        text:"Tournament data is not available."
      })
    );

    return;
  }


  state.bracket =
    annotate(state.bracket);


  /*
   * PRELIMINARY
   */

  if(
    state.bracket.prelim &&
    state.bracket.prelim.length
  ){

    const section =
      el("section");

    const title =
      el("div",{
        class:"section-title"
      });

    title.appendChild(
      el("h2",{
        text:"KNOCKOUT BRACKET"
      })
    );

    title.appendChild(
      el("span",{
        text:"LIVE RESULTS"
      })
    );

    section.appendChild(title);


    const bracket =
      el("div",{
        class:"bracket"
      });

    const rounds =
      el("div",{
        class:"rounds"
      });


    [
      "prelim",
      "r16",
      "qf",
      "sf",
      "final"
    ].forEach(round => {

      rounds.appendChild(
        renderRound(round)
      );

    });


    bracket.appendChild(rounds);
    section.appendChild(bracket);

    app.appendChild(section);

  }
  else{

    const section =
      el("section");

    const title =
      el("div",{
        class:"section-title"
      });

    title.appendChild(
      el("h2",{
        text:"KNOCKOUT BRACKET"
      })
    );

    section.appendChild(title);

    const bracket =
      el("div",{
        class:"bracket"
      });

    const rounds =
      el("div",{
        class:"rounds"
      });


    [
      "r16",
      "qf",
      "sf",
      "final"
    ].forEach(round => {

      rounds.appendChild(
        renderRound(round)
      );

    });


    bracket.appendChild(rounds);
    section.appendChild(bracket);

    app.appendChild(section);

  }


  /*
   * THIRD PLACE
   */

  if(
    state.bracket.third &&
    state.bracket.third.length
  ){

    const section =
      el("section");

    const title =
      el("div",{
        class:"section-title"
      });

    title.appendChild(
      el("h2",{
        text:"THIRD PLACE"
      })
    );

    section.appendChild(title);


    const bracket =
      el("div",{
        class:"bracket"
      });

    const rounds =
      el("div",{
        class:"rounds"
      });

    rounds.appendChild(
      renderRound("third")
    );

    bracket.appendChild(rounds);

    section.appendChild(bracket);

    app.appendChild(section);

  }


  /*
   * CHAMPION
   */

  const champion =
    renderChampion();

  if(champion){
    app.appendChild(champion);
  }


  /*
   * ROSTER
   */

  if(state.players.length){

    const panel =
      el("div",{
        class:"roster-panel"
      });

    const title =
      el("div",{
        class:"section-title"
      });

    title.appendChild(
      el("h2",{
        text:"TOURNAMENT PLAYERS"
      })
    );

    title.appendChild(
      el("span",{
        text:String(state.players.length) + " PLAYERS"
      })
    );

    panel.appendChild(title);


    const roster =
      el("div",{
        class:"roster-grid"
      });


    state.players.forEach(player => {

      roster.appendChild(
        el("div",{
          class:"roster-player",
          text:player
        })
      );

    });


    panel.appendChild(roster);

    app.appendChild(panel);

  }

}


/*
 * ------------------------------------------------------------
 * REFRESH
 * ------------------------------------------------------------
 */

document
  .getElementById("refreshBtn")
  .addEventListener("click",() => {

    window.location.reload();

  });


/*
 * ------------------------------------------------------------
 * INITIALIZE
 * ------------------------------------------------------------
 */

if(
  typeof TOURNAMENT_DATA === "undefined"
){

  document
    .getElementById("app")
    .innerHTML = `
      <div class="empty">
        ERROR: tournament-data.js could not be loaded.
        <br><br>
        Make sure <strong>tournament-data.js</strong>
        is in the same GitHub folder as
        <strong>index.html</strong>.
      </div>
  `;

}
else{

  state.bracket =
    annotate(state.bracket);

  render();

}

</script>
