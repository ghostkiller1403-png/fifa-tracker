<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIFA 26 Tournament</title>

<script src="tournament-data.js"></script>

<style>

:root {
    --bg:#061b14;
    --panel:#0b2b21;
    --line:#174c3a;
    --text:#e6f4ed;
    --muted:#8caea1;
    --accent:#2cc77c;
    --gold:#d8a934;
}

* {
    box-sizing:border-box;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

.topbar {
    background:#071f18;
    border-bottom:1px solid var(--line);
    padding:14px 18px;
    text-align:center;
}

.topbar h1 {
    margin:0;
    font-size:20px;
    letter-spacing:.5px;
}

.topbar p {
    margin:5px 0 0;
    color:var(--muted);
    font-size:11px;
}

.info {
    max-width:1500px;
    margin:12px auto 0;
    padding:0 18px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
}

.badge {
    border:1px solid var(--line);
    background:#09251c;
    color:var(--muted);
    padding:6px 9px;
    border-radius:5px;
    font-size:11px;
}

.badge strong {
    color:var(--text);
}

#bracket {
    width:max-content;
    min-width:100%;
    padding:18px;
    display:grid;
    grid-template-columns:repeat(5,minmax(230px,1fr));
    gap:28px;
    align-items:start;
}

.stage h2 {
    margin:0 0 10px;
    text-align:center;
    font-size:11px;
    letter-spacing:1.2px;
    color:#45c98a;
}

.stage-list {
    display:flex;
    flex-direction:column;
}

.match {
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:7px;
    padding:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.22);
    position:relative;
}

.match + .match {
    margin-top:16px;
}

.match .time {
    font-size:10px;
    color:var(--gold);
    font-weight:bold;
    margin-bottom:6px;
}

.player {
    display:flex;
    align-items:center;
    gap:7px;
    min-height:25px;
    border-bottom:1px solid #153f31;
    padding:3px 2px;
    font-size:11px;
}

.player:last-of-type {
    border-bottom:0;
}

.player .name {
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.roll {
    color:#71998b;
    font-size:9px;
    margin-left:3px;
}

.score {
    min-width:25px;
    text-align:center;
    font-weight:bold;
    background:#082119;
    border-radius:3px;
    padding:3px 4px;
}

.player.winner {
    color:#fff;
    font-weight:bold;
}

.player.winner .score {
    background:#175b40;
}

.player.loser {
    opacity:.58;
}

.match-foot {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:7px;
    min-height:20px;
}

.status {
    font-size:9px;
    color:var(--muted);
}

.empty {
    color:#5d8074;
    font-style:italic;
}

.stage.prelim .match {
    min-height:105px;
}

.stage.r16 .match {
    margin-top:30px;
}

.stage.qf .match {
    margin-top:104px;
}

.stage.sf .match {
    margin-top:255px;
}

.stage.final .match {
    margin-top:510px;
}

.stage.r16 .match + .match {
    margin-top:30px;
}

.stage.qf .match + .match {
    margin-top:155px;
}

.stage.sf .match + .match {
    margin-top:470px;
}

.note {
    max-width:1500px;
    margin:0 auto 20px;
    padding:0 18px;
    color:var(--muted);
    font-size:11px;
    text-align:center;
}

@media(max-width:1000px) {

    #bracket {
        grid-template-columns:repeat(5,250px);
        overflow-x:auto;
    }

}

</style>
</head>

<body>

<header class="topbar">

    <h1>FIFA 26 Tournament</h1>

    <p>
        Single match • 6 minutes each half • Draws go to penalties • No Best of 3
    </p>

</header>

<div class="info">

    <div class="badge">
        Start:
        <strong id="startTime"></strong>
    </div>

    <div class="badge">
        Match:
        <strong id="matchDuration"></strong>
    </div>

    <div class="badge">
        Draw:
        <strong>Penalty Shootout</strong>
    </div>

</div>

<main id="bracket"></main>

<div class="note">

    A drawn match is decided by penalties.
    Results are controlled by the tournament administrator.

</div>

<script>

const stages = [
    {
        id:"prelim",
        label:"PRELIMINARY"
    },
    {
        id:"r16",
        label:"ROUND OF 16"
    },
    {
        id:"qf",
        label:"QUARTERFINALS"
    },
    {
        id:"sf",
        label:"SEMIFINALS"
    },
    {
        id:"final",
        label:"FINAL"
    }
];

const players = Object.fromEntries(
    TOURNAMENT_DATA.players.map(p => [
        p[0],
        {
            name:p[0],
            roll:p[1]
        }
    ])
);

function escapeHtml(value) {

    return String(value).replace(
        /[&<>"']/g,
        character => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[character])
    );

}

function displayPlayer(name) {

    if (!name) {

        return `<span class="empty">TBD</span>`;

    }

    const p = players[name];

    return `
        <span class="name">
            ${escapeHtml(name)}

            ${
                p && p.roll
                ?
                `<span class="roll">${escapeHtml(p.roll)}</span>`
                :
                ""
            }

        </span>
    `;

}

function matchCard(match) {

    const element = document.createElement("article");

    element.className = "match";

    const finished =
        match.winner !== null &&
        match.winner !== undefined;

    const p1Winner =
        finished &&
        match.winner === match.p1;

    const p2Winner =
        finished &&
        match.winner === match.p2;

    let status = "Not played";

    if (match.bye) {

        status = "BYE";

    }
    else if (finished) {

        if (match.penalties) {

            status = `Penalties ${match.penalties}`;

        }
        else {

            status = "Final";

        }

    }

    element.innerHTML = `

        <div class="time">
            ${match.time || "--:--"}
        </div>

        <div class="
            player
            ${p1Winner ? "winner" : ""}
            ${finished && !p1Winner ? "loser" : ""}
        ">

            ${displayPlayer(match.p1)}

            <span class="score">
                ${match.score1 ?? "–"}
            </span>

        </div>

        <div class="
            player
            ${p2Winner ? "winner" : ""}
            ${finished && !p2Winner ? "loser" : ""}
        ">

            ${displayPlayer(match.p2)}

            <span class="score">
                ${match.score2 ?? "–"}
            </span>

        </div>

        <div class="match-foot">

            <span class="status">
                ${status}
            </span>

        </div>
    `;

    return element;

}

function render() {

    document.getElementById("startTime").textContent =
        TOURNAMENT_DATA.settings.startTime;

    document.getElementById("matchDuration").textContent =
        `${TOURNAMENT_DATA.settings.halfMinutes * 2} min`;

    const bracket =
        document.getElementById("bracket");

    bracket.innerHTML = "";

    stages.forEach(stage => {

        const column =
            document.createElement("section");

        column.className =
            `stage ${stage.id}`;

        column.innerHTML = `

            <h2>
                ${stage.label}
            </h2>

            <div class="stage-list"></div>

        `;

        const list =
            column.querySelector(".stage-list");

        TOURNAMENT_DATA.matches
            .filter(match => match.stage === stage.id)
            .forEach(match => {

                list.appendChild(
                    matchCard(match)
                );

            });

        bracket.appendChild(column);

    });

}

render();

</script>

</body>
</html>
