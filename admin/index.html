<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Tournament Admin</title>

<script src="../tournament-data.js"></script>

<style>

:root {
    --bg:#061b14;
    --panel:#0b2b21;
    --line:#174c3a;
    --text:#e6f4ed;
    --muted:#8caea1;
    --green:#168957;
    --danger:#572525;
    --gold:#d8a934;
}

* {
    box-sizing:border-box;
}

body {
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

header {
    background:#071f18;
    border-bottom:1px solid var(--line);
    padding:15px;
    text-align:center;
}

header h1 {
    margin:0;
    font-size:20px;
}

header p {
    margin:5px 0 0;
    color:var(--muted);
    font-size:11px;
}

.container {
    max-width:1300px;
    margin:auto;
    padding:18px;
}

.panel {
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:15px;
    margin-bottom:15px;
}

.panel h2 {
    font-size:14px;
    margin:0 0 12px;
}

.settings {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

label {
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-bottom:5px;
}

input,
select {
    width:100%;
    background:#061b14;
    color:var(--text);
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px;
}

.match-grid {
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));
    gap:10px;
}

.match {
    background:#071f18;
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px;
}

.stage {
    color:#45c98a;
    font-size:9px;
    text-transform:uppercase;
    margin-bottom:8px;
}

.match-title {
    font-size:11px;
    margin-bottom:8px;
    color:var(--gold);
}

.field {
    margin-bottom:7px;
}

.buttons {
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

button {
    border:1px solid var(--line);
    background:#0d3328;
    color:var(--text);
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

button:hover {
    background:#124332;
}

button.green {
    background:var(--green);
}

button.red {
    background:var(--danger);
}

button.gold {
    background:#5b4a1c;
}

.result {
    border-top:1px solid var(--line);
    margin-top:8px;
    padding-top:8px;
}

.result-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.notice {
    background:#09251c;
    border:1px solid var(--line);
    padding:10px;
    border-radius:6px;
    color:var(--muted);
    font-size:11px;
    line-height:1.5;
}

@media(max-width:700px) {

    .settings {
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

    <h1>FIFA 26 Tournament — ADMIN</h1>

    <p>
        No password required
    </p>

</header>

<div class="container">

    <div class="notice">

        <strong>Admin controls</strong><br>

        You can edit the bracket, timings and scores here.
        A draw must be decided by penalties.
        There is no Best of 3.

    </div>

    <div class="panel">

        <h2>Tournament Timing</h2>

        <div class="settings">

            <div>
                <label>Starting Time</label>

                <input
                    id="startTime"
                    type="time"
                >

            </div>

            <div>
                <label>Minutes Per Half</label>

                <input
                    id="halfMinutes"
                    type="number"
                    min="1"
                    max="30"
                >

            </div>

            <div>
                <label>Gap Between Matches</label>

                <input
                    id="gapMinutes"
                    type="number"
                    min="0"
                    max="60"
                >

            </div>

        </div>

    </div>

    <div class="panel">

        <h2>Manual Bracket Setup</h2>

        <div
            class="match-grid"
            id="bracketEditor">
        </div>

    </div>

    <div class="buttons">

        <button
            class="green"
            onclick="saveChanges()">

            Save Changes

        </button>

        <button
            class="gold"
            onclick="downloadData()">

            Generate tournament-data.js

        </button>

        <button
            class="red"
            onclick="resetTournament()">

            Reset Tournament

        </button>

    </div>

</div>

<script>

const players =
    TOURNAMENT_DATA.players;

function escapeHtml(value) {

    return String(value).replace(
        /[&<>"']/g,
        character => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[character])
    );

}

function playerOptions(selected) {

    let html =
        `<option value="">TBD / Empty</option>`;

    players.forEach(player => {

        const selectedValue =
            selected === player[0]
            ? "selected"
            : "";

        html += `
            <option
                value="${escapeHtml(player[0])}"
                ${selectedValue}
            >
                ${escapeHtml(player[0])}
                ${player[1] ? " — " + escapeHtml(player[1]) : ""}
            </option>
        `;

    });

    return html;

}

function renderEditor() {

    document.getElementById("startTime").value =
        TOURNAMENT_DATA.settings.startTime;

    document.getElementById("halfMinutes").value =
        TOURNAMENT_DATA.settings.halfMinutes;

    document.getElementById("gapMinutes").value =
        TOURNAMENT_DATA.settings.gapMinutes;

    const container =
        document.getElementById("bracketEditor");

    container.innerHTML = "";

    TOURNAMENT_DATA.matches.forEach(match => {

        const div =
            document.createElement("div");

        div.className = "match";

        div.innerHTML = `

            <div class="stage">
                ${match.stage}
            </div>

            <div class="match-title">
                ${match.id}
            </div>

            <div class="field">

                <label>
                    Player 1
                </label>

                <select
                    data-id="${match.id}"
                    data-player="p1">

                    ${playerOptions(match.p1)}

                </select>

            </div>

            <div class="field">

                <label>
                    Player 2
                </label>

                <select
                    data-id="${match.id}"
                    data-player="p2">

                    ${playerOptions(match.p2)}

                </select>

            </div>

            <div class="result">

                <div class="result-grid">

                    <div>

                        <label>
                            Score 1
                        </label>

                        <input
                            type="number"
                            min="0"
                            data-id="${match.id}"
                            data-value="score1"
                            value="${match.score1 ?? ""}"
                        >

                    </div>

                    <div>

                        <label>
                            Score 2
                        </label>

                        <input
                            type="number"
                            min="0"
                            data-id="${match.id}"
                            data-value="score2"
                            value="${match.score2 ?? ""}"
                        >

                    </div>

                </div>

                <div class="field">

                    <label>
                        Winner
                    </label>

                    <select
                        data-id="${match.id}"
                        data-value="winner">

                        ${playerOptions(match.winner)}

                    </select>

                </div>

                <div class="field">

                    <label>
                        Penalty Score
                    </label>

                    <input
                        type="text"
                        data-id="${match.id}"
                        data-value="penalties"
                        value="${match.penalties ?? ""}"
                        placeholder="Example: 4-3"
                    >

                </div>

            </div>

        `;

        container.appendChild(div);

    });

}

function saveChanges() {

    TOURNAMENT_DATA.settings.startTime =
        document.getElementById("startTime").value;

    TOURNAMENT_DATA.settings.halfMinutes =
        Number(
            document.getElementById("halfMinutes").value
        );

    TOURNAMENT_DATA.settings.gapMinutes =
        Number(
            document.getElementById("gapMinutes").value
        );

    document
        .querySelectorAll("select[data-player]")
        .forEach(select => {

            const match =
                TOURNAMENT_DATA.matches.find(
                    m => m.id === select.dataset.id
                );

            if (!match) return;

            match[select.dataset.player] =
                select.value || null;

        });

    document
        .querySelectorAll("input[data-value]")
        .forEach(input => {

            const match =
                TOURNAMENT_DATA.matches.find(
                    m => m.id === input.dataset.id
                );

            if (!match) return;

            const key =
                input.dataset.value;

            if (
                key === "score1" ||
                key === "score2"
            ) {

                match[key] =
                    input.value === ""
                    ? null
                    : Number(input.value);

            }
            else {

                match[key] =
                    input.value || null;

            }

        });

    localStorage.setItem(
        "TOURNAMENT_ADMIN_DATA",
        JSON.stringify(TOURNAMENT_DATA)
    );

    alert(
        "Changes saved in this browser.\n\n" +
        "Use 'Generate tournament-data.js' " +
        "to create the updated GitHub data."
    );

}

function downloadData() {

    saveChanges();

    const content =
`const TOURNAMENT_DATA = ${JSON.stringify(
    TOURNAMENT_DATA,
    null,
    4
)};`;

    const blob =
        new Blob(
            [content],
            {
                type:"application/javascript"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "tournament-data.js";

    link.click();

    URL.revokeObjectURL(url);

}

function resetTournament() {

    if (
        !confirm(
            "Reset the entire tournament?\n\n" +
            "This will remove all scores, winners " +
            "and bracket changes."
        )
    ) {
        return;
    }

    localStorage.removeItem(
        "TOURNAMENT_ADMIN_DATA"
    );

    location.reload();

}

const saved =
    localStorage.getItem(
        "TOURNAMENT_ADMIN_DATA"
    );

if (saved) {

    try {

        const data =
            JSON.parse(saved);

        Object.assign(
            TOURNAMENT_DATA,
            data
        );

    }
    catch(error) {

        console.error(error);

    }

}

renderEditor();

</script>

</body>
</html>
